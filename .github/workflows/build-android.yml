name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    if: github.repository == 'HoneyVPN/honeyproxyutility-' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare and verify the effective Android cores
        run: python3 -B scripts/prepare_android_cores.py --cache-dir build/android-core-cache --download

      - name: Validate release version
        id: metadata
        run: python3 scripts/release_metadata.py

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      # A single universal APK also works with the 1.1.21 updater, which
      # selected ARM64 even on other architectures whenever a split was present.
      - name: Build universal APK — ARMv7, ARM64 and x86_64
        run: |
          flutter build apk --flavor direct --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=FLAVOR=direct

      - name: Check Android session ownership and child lifecycle
        run: python3 -B scripts/check_android_lifecycle.py

      - name: Name and verify the only distributable APK
        run: |
          TAG="v${{ steps.metadata.outputs.version }}"
          outdir="build/app/outputs/flutter-apk"
          mv "$outdir/app-direct-release.apk" "$outdir/HoneyProxyUtility-${TAG}-universal.apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          python3 -B scripts/validate_android_release_apk.py \
            --apk "$outdir/HoneyProxyUtility-${TAG}-universal.apk" \
            --build-tools "$tools" \
            --java "$JAVA_HOME/bin/java" \
            --strip-tool "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --receipt "$outdir/android-release-verification.json"

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoneyProxyUtility-Android-${{ steps.metadata.outputs.version }}
          path: build/app/outputs/flutter-apk/HoneyProxyUtility-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Deploy APK to honeyvpn.ru
        # Publication is disabled here; release both reviewed assets separately.
        if: ${{ false }}
        run: |
          TAG="v${{ steps.metadata.outputs.version }}"
          APK="build/app/outputs/flutter-apk/HoneyProxyUtility-${TAG}-universal.apk"
          test -f "$APK"
          if [ -n "$APK" ]; then
            curl -X POST https://api.honeyvpn.ru/deploy/android \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
              -H "X-Version: $TAG" \
              -F "file=@$APK" \
              --fail --show-error --max-time 300
          fi

      - name: Create GitHub Release (public repo)
        # Publication is disabled here; release both reviewed assets separately.
        if: ${{ false }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          repository: HoneyVPN/HoneyProxyUtility
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/app/outputs/flutter-apk/HoneyProxyUtility-*.apk
          name: HoneyProxyUtility ${{ github.ref_name }}
          body: |
            ## HoneyProxyUtility ${{ github.ref_name }} — Android

            ### Поддерживаемые протоколы
            VLESS Reality · VLESS xHTTP · VMess · Trojan · Shadowsocks · Hysteria2 · TUIC · WireGuard · **AmneziaWG** · ShadowTLS + Shadowsocks

            NaiveProxy доступен для импорта и конвертации. Подключение в текущей сборке ядра недоступно.

            ### Скачать APK
            Один **universal APK**: armeabi-v7a, arm64-v8a и x86_64.
            One **universal APK** supports ARMv7, ARM64 and x86_64.

            ### Установка
            1. Скачай universal APK / Download the universal APK
            2. Разреши установку из этого источника / Allow installation from this source
            3. Установи и добавь подписку через @honeyvpnru_bot / Install and import your subscription
